el\",\n        open ? \"Menüyü kapat\" : \"Menüyü aç\"\n    );\n}\n\nmenuButton.addEventListener(\"click\", event => {\n    event.stopPropagation();\n    setMenuOpen(!dropdownMenu.classList.contains(\"open\"));\n});\n\ndocument.addEventListener(\"click\", event => {\n    if (!navLinks.contains(event.target)) {\n        setMenuOpen(false);\n    }\n});\n\ndocument.addEventListener(\"keydown\", event => {\n    if (event.key === \"Escape\") {\n        setMenuOpen(false);\n    }\n});\n\n/* GRID VARIABLES */\nlet columns = 1;\nlet rows = 1;\nlet cellWidth = 50;\nlet cellHeight = 50;\n\n/* RESPONSIVE GRID CALCULATION */\nfunction calculateGrid() {\n    const width = window.innerWidth;\n    const viewportHeight = window.innerHeight;\n    const landscape = width >= viewportHeight;\n\n    const minDivisor = landscape ? 4 : 2.5;\n    const maxDivisor = landscape ? 8 : 4;\n    const preferredDivisor = landscape ? 8 : 2.8;\n\n    let bestScore = Infinity;\n    let best = null;\n\n    for (\n        let divisor = minDivisor;\n        divisor <= maxDivisor + 0.001;\n        divisor += 0.1\n    ) {\n        let availableHeight = viewportHeight;\n        let testColumns = 1;\n        let testRows = 1;\n        let testCellWidth = 1;\n        let testCellHeight = 1;\n        let headerHeight = 0;\n\n        for (let iteration = 0; iteration < 4; iteration++) {\n            const baseSize = Math.min(width, availableHeight);\n            const targetSize = baseSize / divisor;\n\n            testColumns = Math.max(\n                1,\n                Math.round(width / targetSize)\n            );\n\n            testRows = Math.max(\n                1,\n                Math.round(availableHeight / targetSize)\n            );\n\n            testCellWidth = width / testColumns;\n            testCellHeight = availableHeight / testRows;\n\n            headerHeight = testCellHeight / 4;\n            availableHeight = viewportHeight - headerHeight;\n        }\n\n        const ratioError = Mat , event => {\n    if (!navLinks.contains(event.target)) {\n        setMenuOpen(false);\n    }\n});\n\ndocument.addEventListener(\"keydown\", event => {\n    if (event.key === \"Escape\") setMenuOpen(false);\n});\n\ndocument.querySelectorAll(\".dropdown-link\").forEach(link => {\n    link.addEventListener(\"click\", () => setMenuOpen(false));\n});\n\n/* GRID VARIABLES */\nlet columns = 1;\nlet rows = 1;\nlet cellWidth = 50;\nlet cellHeight = 50;\n\n/* GAME VARIABLES */\nlet snake = [];\nlet direction = { x: 1, y: 0 };\nlet nextDirection = { x: 1, y: 0 };\nlet projects = [];\n\nlet eatenCount = 0;\nlet lastSpawnedProjectId = null;\nlet gameRunning = false;\nlet gameStarted = false;\nlet gameTimer = null;\nlet startDelay = null;\n\nconst TOTAL_PROJECTS = 10;\nconst PROJECTS_TO_REPLACE = 10;\n\n/*\n    NEW RESPONSIVE PREVIEW RULE\n\n    Portrait screen:\n      Width < 768px  -> 1 preview\n      Width >= 768px -> 3 previews\n\n    Landscape screen:\n      Always 3 previews\n\n    Preview dimensions NEVER change.\n*/\nconst PORTRAIT_TABLET_BREAKPOINT = 768;\n\nconst PREVIEW_COLS = 3;\nconst PREVIEW_ROWS = 2;\nconst PREVIEW_GAP = 1;\nconst SOURCE_GAP = 1;\nconst MAX_PREVIEW_COUNT = 3;\n\nfunction getPreviewCount() {\n    const portrait =\n        window.innerHeight > window.innerWidth;\n\n    if (\n        portrait &&\n        window.innerWidth < PORTRAIT_TABLET_BREAKPOINT\n    ) {\n        return 1;\n    }\n\n    return MAX_PREVIEW_COUNT;\n}\n\n/* PROJECT DATA */\nconst projectData = [\n    {\n        id: \"01\", name: \"\", url: \"project-01.html\",\n        images: [\"\", \"\", \"\"]\n    },\n    {\n        id: \"02\", name: \"\", url: \"project-02.html\",\n        images: [\"\", \"\", \"\"]\n    },\n    {\n        id: \"03\", name: \"\", url: \"project-03.html\",\n        images: [\"\", \"\", \"\"]\n    },\n    {\n        id: \"04\", name: \"\", url: \"project-04.html\",\n        images: [\"\", \"\", \"\"]\n    },\n    {\n        id: \"05\", name: \"\", url: \"project-05.html\",\n        images: [\"\", \"\", \"\"]\n    },\n    {\n        id: \"06\", name: \"\", url: \"project-06.html\",\n        images: [\"\", \"\", \"\"]\n    },\n    {\n        id: \"07\", name: \"\", url: \"project-07.html\",\n        images: [\"\", \"\", \"\"]\n    },\n    {\n        id: \"08\", name: \"\", url: \"project-08.html\",\n        images: [\"\", \"\", \"\"]\n    },\n    {\n        id: \"09\", name: \"\", url: \"project-09.html\",\n        images: [\"\", \"\", \"\"]\n    },\n    {\n        id: \"10\", name: \"\", url: \"project-10.html\",\n        images: [\"\", \"\", \"\"]\n    }\n];\n\n/* GRID CALCULATION */\nfunction calculateGrid() {\n    const width = window.innerWidth;\n    const viewportHeight = window.innerHeight;\n    const landscape = width >= viewportHeight;\n\n    const minDivisor = landscape ? 4 : 2.5;\n    const maxDivisor = landscape ? 8 : 4;\n    const preferredDivisor = landscape ? 8 : 2.8;\n\n    let bestScore = Infinity;\n    let best = null;\n\n    for (\n        let divisor = minDivisor;\n        divisor <= maxDivisor + 0.001;\n        divisor += 0.1\n    ) {\n        let availableHeight = viewportHeight;\n        let testColumns = 1;\n        let testRows = 1;\n        let testCellWidth = 1;\n        let testCellHeight = 1;\n        let headerHeight = 0;\n\n        for (let iteration = 0; iteration < 4; iteration++) {\n            const baseSize = Math.min(width, availableHeight);\n            const targetSize = baseSize / divisor;\n\n            testColumns = Math.max(\n                1,\n                Math.round(width / targetSize)\n            );\n\n            testRows = Math.max(\n                1,\n                Math.round(availableHeight / targetSize)\n            );\n\n            testCellWidth = width / testColumns;\n            testCellHeight = availableHeight / testRows;\n\n            headerHeight = testCellHeight / 4;\n            availableHeight = viewportHeight - headerHeight;\n        }\n\n        const ratioError = Math.abs(\n            Math.log(testCellWidth / testCellHeight)\n        );\n\n        const sizePenalty =\n            Math.abs(divisor - preferredDivisor) * 0.0005;\n\n        const score = ratioError + sizePenalty;\n\n        if (score < bestScore) {\n            bestScore = score;\n            best = {\n                columns: testColumns,\n                rows: testRows,\n                cellWidth: testCellWidth,\n                cellHeight: testCellHeight,\n                headerHeight\n            };\n        }\n    }\n\n    columns = best.columns;\n    rows = best.rows;\n    cellWidth = width / columns;\n    cellHeight =\n        (viewportHeight - best.headerHeight) / rows;\n\n    document.documentElement.style.setProperty(\n        \"--header-height\",\n        best.headerHeight + \"px\"\n    );\n    document.documentElement.style.setProperty(\n        \"--cell-width\",\n        cellWidth + \"px\"\n    );\n    document.documentElement.style.setProperty(\n        \"--cell-height\",\n        cellHeight + \"px\"\n    );\n\n    setupGame();\n}\n\n/* HELPERS */\nfunction randomInt(max) {\n    return Math.floor(Math.random() * max);\n}\n\nfunction cellKey(cell) {\n    return cell.x + \",\" + cell.y;\n}\n\nfunction isInside(cell) {\n    return (\n        cell.x >= 0 &&\n        cell.x < columns &&\n        cell.y >= 0 &&\n        cell.y < rows\n    );\n}\n\nfunction getOccupiedCells() {\n    const occupied = new Set();\n\n    snake.forEach(cell => occupied.add(cellKey(cell)));\n    projects.forEach(cell => occupied.add(cellKey(cell)));\n\n    return occupied;\n}\n\nfunction getFreePosition() {\n    const occupied = getOccupiedCells();\n    const free = [];\n\n    for (let y = 0; y < rows; y++) {\n        for (let x = 0; x < columns; x++) {\n            const cell = { x, y };\n\n            if (!occupied.has(cellKey(cell))) {\n                free.push(cell);\n            }\n        }\n    }\n\n    return free.length ? free[randomInt(free.length)] : null;\n}\n\n/* RANDOM SNAKE */\nfunction createRandomSnake() {\n    const shapes = [\"horizontal\", \"vertical\", \"L\"];\n    const shape = shapes[randomInt(shapes.length)];\n\n    for (let attempt = 0; attempt < 300; attempt++) {\n        const head = {\n            x: 2 + randomInt(Math.max(1, columns - 4)),\n            y: 2 + randomInt(Math.max(1, rows - 4))\n        };\n\n        const directions = [\n            { x: 1, y: 0 },\n            { x: -1, y: 0 },\n            { x: 0, y: 1 },\n            { x: 0, y: -1 }\n        ];\n\n        let d = directions[randomInt(directions.length)];\n\n        if (shape === \"horizontal\") {\n            d = directions[randomInt(2)];\n        } else if (shape === \"vertical\") {\n            d = directions[2 + randomInt(2)];\n        }\n\n        let body;\n\n        if (shape === \"L\") {\n            const perpendicular = {\n                x: -d.y,\n                y: d.x\n            };\n\n            body = [\n                head,\n                {\n                    x: head.x - d.x,\n                    y: head.y - d.y\n                },\n                {\n                    x: head.x - d.x - perpendicular.x,\n                    y: head.y - d.y - perpendicular.y\n                }\n            ];\n        } else {\n            body = [\n                head,\n                {\n                    x: head.x - d.x,\n                    y: head.y - d.y\n                },\n                {\n                    x: head.x - 2 * d.x,\n                    y: head.y - 2 * d.y\n                }\n            ];\n        }\n\n        if (\n            body.every(isInside) &&\n            new Set(body.map(cellKey)).size === 3\n        ) {\n            snake = body;\n            direction = { ...d };\n            nextDirection = { ...d };\n            return;\n        }\n    }\n\n    const y = Math.min(1, rows - 1);\n    snake = [\n        { x: Math.min(2, columns - 1), y },\n        { x: Math.min(1, columns - 1), y },\n        { x: 0, y }\n    ];\n    direction = { x: 1, y: 0 };\n    nextDirection = { ...direction };\n}\n\n/* PROJECTS */\nfunction selectRandomProject() {\n    let choices = projectData.filter(\n        data => data.id !== lastSpawnedProjectId\n    );\n\n    if (!choices.length) choices = projectData;\n\n    const selected = choices[randomInt(choices.length)];\n    lastSpawnedProjectId = selected.id;\n\n    return selected;\n}\n\nfunction spawnProject(projectInfo = null) {\n    const position = getFreePosition();\n    if (!position) return false;\n\n    const data = projectInfo || selectRandomProject();\n\n    projects.push({\n        ...position,\n        id: data.id,\n        name: data.name,\n        url: data.url,\n        images: data.images\n    });\n\n    return true;\n}\n\nfunction createProjects() {\n    projects = [];\n    lastSpawnedProjectId = null;\n\n    const shuffled = [...projectData];\n\n    for (let i = shuffled.length - 1; i > 0; i--) {\n        const j = randomInt(i + 1);\n        [shuffled[i], shuffled[j]] =\n            [shuffled[j], shuffled[i]];\n    }\n\n    shuffled.slice(0, TOTAL_PROJECTS).forEach(\n        data => spawnProject(data)\n    );\n}\n\n/* PREVIEW PLACEMENT */\nlet activePreviewKey = null;\nlet activeHoveredCell = null;\nlet pointerX = null;\nlet pointerY = null;\n\nfunction rectanglesOverlap(a, b) {\n    return (\n        a.x < b.x + b.w &&\n        a.x + a.w > b.x &&\n        a.y < b.y + b.h &&\n        a.y + a.h > b.y\n    );\n}\n\nfunction panelsTooClose(a, b, gap = PREVIEW_GAP) {\n    return (\n        a.x < b.x + b.w + gap &&\n        a.x + a.w + gap > b.x &&\n        a.y < b.y + b.h + gap &&\n        a.y + a.h + gap > b.y\n    );\n}\n\n/*\n    RESPONSIVE POSITION SEARCH\n\n    Phone portrait:\n      Search for 1 panel.\n\n    Tablet portrait and landscape:\n      Search for 3 panels.\n\n    All panels remain 3x2.\n*/\nfunction findPreviewPositions(source) {\n    const targetCount = getPreviewCount();\n\n    const protectedArea = {\n        x: source.x - SOURCE_GAP,\n        y: source.y - SOURCE_GAP,\n        w: 1 + SOURCE_GAP * 2,\n        h: 1 + SOURCE_GAP * 2\n    };\n\n    const candidates = [];\n\n    for (let y = 0; y <= rows - PREVIEW_ROWS; y++) {\n        for (let x = 0; x <= columns - PREVIEW_COLS; x++) {\n            const rectangle = {\n                x,\n                y,\n                w: PREVIEW_COLS,\n                h: PREVIEW_ROWS\n            };\n\n            if (rectanglesOverlap(rectangle, protectedArea)) {\n                continue;\n            }\n\n            const dx = Math.max(\n                0,\n                source.x - (x + PREVIEW_COLS),\n                x - (source.x + 1)\n            );\n\n            const dy = Math.max(\n                0,\n                source.y - (y + PREVIEW_ROWS),\n                y - (source.y + 1)\n            );\n\n            const distance = dx * dx + dy * dy;\n\n            candidates.push({\n                ...rectangle,\n                score: distance + Math.random() * .25\n            });\n        }\n    }\n\n    candidates.sort((a, b) => a.score - b.score);\n\n    /* PHONE: ONLY IMAGE 01 */\n    if (targetCount === 1) {\n        return candidates.length ? [candidates[0]] : [];\n    }\n\n    /*\n        TABLET / LANDSCAPE:\n        Find three panels with one-cell gaps.\n    */\n    const pool = candidates.slice(0, 100);\n    let bestSet = [];\n    let bestScore = Infinity;\n\n    for (let i = 0; i < pool.length; i++) {\n        const a = pool[i];\n\n        for (let j = i + 1; j < pool.length; j++) {\n            const b = pool[j];\n\n            if (panelsTooClose(a, b)) continue;\n\n            for (let k = j + 1; k < pool.length; k++) {\n                const c = pool[k];\n\n                if (\n                    panelsTooClose(a, c) ||\n                    panelsTooClose(b, c)\n                ) {\n                    continue;\n                }\n\n                const score =\n                    a.score + b.score + c.score;\n\n                if (score < bestScore) {\n                    bestScore = score;\n                    bestSet = [a, b, c];\n                }\n            }\n        }\n    }\n\n    if (bestSet.length === 3) return bestSet;\n\n    /*\n        If the grid cannot accommodate three,\n        show as many as possible without\n        violating the spacing rules.\n    */\n    const selected = [];\n\n    for (const candidate of candidates) {\n        if (\n            selected.every(\n                item => !panelsTooClose(item, candidate)\n            )\n        ) {\n            selected.push(candidate);\n        }\n\n        if (selected.length === targetCount) break;\n    }\n\n    return selected;\n}\n\n/* SHOW PREVIEWS */\nfunction showProjectPreviews(project) {\n    const key =\n        project.id + \":\" +\n        project.x + \":\" +\n        project.y + \":\" +\n        getPreviewCount();\n\n    if (activePreviewKey === key) return;\n\n    activePreviewKey = key;\n    previewLayer.replaceChildren();\n\n    const positions = findPreviewPositions(project);\n\n    positions.forEach((position, index) => {\n        const panel = document.createElement(\"div\");\n        panel.className = \"preview-panel\";\n\n        panel.style.left =\n            position.x * cellWidth + \"px\";\n        panel.style.top =\n            position.y * cellHeight + \"px\";\n\n        const imagePath = project.images?.[index];\n\n        if (imagePath) {\n            const image = document.createElement(\"img\");\n            image.className = \"preview-image\";\n            image.src = imagePath;\n            image.alt =\n                \"Proje \" + project.id +\n                \" görsel \" + (index + 1);\n            panel.appendChild(image);\n        }\n\n        const label = document.createElement(\"span\");\n        label.className = \"preview-label\";\n        label.textContent =\n            \"görsel\" +\n            String(index + 1).padStart(2, \"0\");\n\n        panel.appendChild(label);\n        previewLayer.appendChild(panel);\n    });\n}\n\nfunction hideProjectPreviews() {\n    activePreviewKey = null;\n    previewLayer.replaceChildren();\n}\n\n/* HOVER */\nfunction clearProjectHover() {\n    activeHoveredCell = null;\n    grid.classList.remove(\"project-hover-active\");\n\n    grid.querySelectorAll(\".project.is-hovered\").forEach(\n        element => element.classList.remove(\"is-hovered\")\n    );\n\n    hideProjectPreviews();\n}\n\nfunction activateProjectHover(project, element) {\n    const key =\n        project.x + \",\" +\n        project.y + \":\" +\n        project.id;\n\n    if (activeHoveredCell === key) return;\n\n    activeHoveredCell = key;\n\n    grid.querySelectorAll(\".project.is-hovered\").forEach(\n        item => item.classList.remove(\"is-hovered\")\n    );\n\n    element.classList.add(\"is-hovered\");\n    grid.classList.add(\"project-hover-active\");\n\n    showProjectPreviews(project);\n}\n\nfunction refreshProjectHover() {\n    if (pointerX === null || pointerY === null) {\n        clearProjectHover();\n        return;\n    }\n\n    const rect = grid.getBoundingClientRect();\n    const localX = pointerX - rect.left;\n    const localY = pointerY - rect.top;\n\n    if (\n        localX < 0 ||\n        localY < 0 ||\n        localX >= rect.width ||\n        localY >= rect.height\n    ) {\n        clearProjectHover();\n        return;\n    }\n\n    const x = Math.floor(localX / cellWidth);\n    const y = Math.floor(localY / cellHeight);\n\n    const project = projects.find(\n        item => item.x === x && item.y === y\n    );\n\n    if (!project) {\n        clearProjectHover();\n        return;\n    }\n\n    const element = [\n        ...grid.querySelectorAll(\".project\")\n    ].find(\n        item =>\n            Number(item.dataset.x) === project.x &&\n            Number(item.dataset.y) === project.y\n    );\n\n    if (element) {\n        activateProjectHover(project, element);\n    }\n}\n\ngrid.addEventListener(\"pointermove\", event => {\n    if (event.pointerType === \"touch\") return;\n\n    pointerX = event.clientX;\n    pointerY = event.clientY;\n    refreshProjectHover();\n});\n\ngrid.addEventListener(\"pointerleave\", () => {\n    pointerX = null;\n    pointerY = null;\n    clearProjectHover();\n});\n\n/*\n    MOBILE / TABLET TOUCH\n\n    Tap a project to open its previews.\n    Tap an empty cell to close previews.\n*/\ngrid.addEventListener(\"click\", event => {\n    if (event.target.closest(\".snake-start\")) return;\n    if (event.target.closest(\"#game-overlay\")) return;\n\n    if (\n        window.matchMedia(\"(hover: hover) and (pointer: fine)\")\n            .matches\n    ) {\n        return;\n    }\n\n    const rect = grid.getBoundingClientRect();\n    const x = Math.floor(\n        (event.clientX - rect.left) / cellWidth\n    );\n    const y = Math.floor(\n        (event.clientY - rect.top) / cellHeight\n    );\n\n    const project = projects.find(\n        item => item.x === x && item.y === y\n    );\n\n    if (!project) {\n        clearProjectHover();\n        return;\n    }\n\n    const element = [\n        ...grid.querySelectorAll(\".project\")\n    ].find(\n        item =>\n            Number(item.dataset.x) === x &&\n            Number(item.dataset.y) === y\n    );\n\n    if (element) {\n        activateProjectHover(project, element);\n    }\n});\n\n/* RENDER PROJECTS */\nfunction renderProjects() {\n    grid.querySelectorAll(\".project\").forEach(\n        element => element.remove()\n    );\n\n    projects.forEach(project => {\n        const element = document.createElement(\"div\");\n        element.className = \"project\";\n\n        element.dataset.x = project.x;\n        element.dataset.y = project.y;\n\n        element.style.left =\n            project.x * cellWidth + \"px\";\n        element.style.top =\n            project.y * cellHeight + \"px\";\n        element.style.width =\n            cellWidth + \"px\";\n        element.style.height =\n            cellHeight + \"px\";\n\n        const numberLink = document.createElement(\"a\");\n        numberLink.className = \"project-number\";\n        numberLink.textContent = project.id;\n        numberLink.href = project.url;\n\n        numberLink.addEventListener(\"click\", event => {\n            event.stopPropagation();\n        });\n\n        // The entire project tile opens its corresponding project page.\n        element.style.cursor = \"pointer\";\n        element.addEventListener(\"click\", event => {\n            if (event.target.closest(\"a[href]\")) return;\n            event.stopPropagation();\n            window.location.href = project.url;\n        });\n\n        element.appendChild(numberLink);\n\n        const nameElement = document.createElement(\"div\");\n        nameElement.className = \"project-name\";\n        nameElement.textContent = project.name;\n\n        element.appendChild(nameElement);\n        grid.appendChild(element);\n    });\n}\n\n/* RENDER SNAKE */\nfunction renderSnake() {\n    grid.querySelectorAll(\n        \".snake-segment, .snake-head\"\n    ).forEach(element => element.remove());\n\n    snake.forEach((segment, index) => {\n        const element = document.createElement(\"div\");\n\n        element.className =\n            index === 0 ? \"snake-head\" : \"snake-segment\";\n\n        element.style.left =\n            segment.x * cellWidth + \"px\";\n        element.style.top =\n            segment.y * cellHeight + \"px\";\n        element.style.width =\n            cellWidth + \"px\";\n        element.style.height =\n            cellHeight + \"px\";\n\n        if (index === 0 && !gameStarted) {\n            const button = document.createElement(\"button\");\n            button.className = \"snake-start\";\n            button.textContent = \"START\";\n            button.addEventListener(\"click\", startGame);\n            element.appendChild(button);\n        }\n\n        grid.appendChild(element);\n    });\n}\n\nfunction render() {\n    renderSnake();\n    renderProjects();\n\n    /*\n        Rebuild hover state only for mouse.\n        Touch selection stays visible.\n    */\n    if (pointerX !== null && pointerY !== null) {\n        activeHoveredCell = null;\n        refreshProjectHover();\n    } else if (activeHoveredCell !== null) {\n        const selected = projects.find(\n            project =>\n                project.x + \",\" +\n                project.y + \":\" +\n                project.id === activeHoveredCell\n        );\n\n        if (selected) {\n            const element = [\n                ...grid.querySelectorAll(\".project\")\n            ].find(\n                item =>\n                    Number(item.dataset.x) === selected.x &&\n                    Number(item.dataset.y) === selected.y\n            );\n\n            if (element) {\n                element.classList.add(\"is-hovered\");\n            }\n        } else {\n            clearProjectHover();\n        }\n    }\n}\n\n/* GAME */\nfunction getGameSpeed() {\n    return window.innerWidth <= 768 ? 240 : 170;\n}\n\nfunction startGame() {\n    if (gameStarted || gameRunning) return;\n\n    gameStarted = true;\n\n    grid.querySelectorAll(\".snake-start\").forEach(\n        button => button.remove()\n    );\n\n    startDelay = setTimeout(() => {\n        gameRunning = true;\n        gameTimer = setInterval(moveSnake, getGameSpeed());\n    }, 1000);\n}\n\nfunction changeDirection(x, y) {\n    if (\n        x === -direction.x &&\n        y === -direction.y\n    ) {\n        return;\n    }\n\n    nextDirection = { x, y };\n}\n\nfunction moveSnake() {\n    if (!gameRunning) return;\n\n    direction = { ...nextDirection };\n\n    const head = {\n        x: snake[0].x + direction.x,\n        y: snake[0].y + direction.y\n    };\n\n    /* PORTAL EDGES */\n    if (head.x < 0) head.x = columns - 1;\n    if (head.x >= columns) head.x = 0;\n    if (head.y < 0) head.y = rows - 1;\n    if (head.y >= rows) head.y = 0;\n\n    const eatenIndex = projects.findIndex(\n        project =>\n            project.x === head.x &&\n            project.y === head.y\n    );\n\n    const eating = eatenIndex !== -1;\n    const bodyToCheck = eating\n        ? snake\n        : snake.slice(0, -1);\n\n    const hitSelf = bodyToCheck.some(\n        segment =>\n            segment.x === head.x &&\n            segment.y === head.y\n    );\n\n    if (hitSelf) {\n        endGame(false);\n        return;\n    }\n\n    snake.unshift(head);\n\n    if (eating) {\n        projects.splice(eatenIndex, 1);\n        eatenCount++;\n\n        if (eatenCount >= PROJECTS_TO_REPLACE) {\n            spawnProject();\n        }\n    } else {\n        snake.pop();\n    }\n\n    render();\n\n    if (snake.length >= columns * rows) {\n        endGame(true);\n    }\n}\n\nfunction endGame(won) {\n    gameRunning = false;\n    gameStarted = false;\n\n    clearInterval(gameTimer);\n    clearTimeout(startDelay);\n\n    gameResult.textContent =\n        won ? \"YOU WIN!\" : \"GAME OVER\";\n\n    projectCount.textContent =\n        \"Projects eaten: \" + eatenCount;\n\n    overlay.classList.add(\"visible\");\n    clearProjectHover();\n}\n\nfunction setupGame() {\n    clearInterval(gameTimer);\n    clearTimeout(startDelay);\n\n    gameRunning = false;\n    gameStarted = false;\n    eatenCount = 0;\n\n    overlay.classList.remove(\"visible\");\n    clearProjectHover();\n\n    createRandomSnake();\n    createProjects();\n    render();\n}\n\nrestartButton.addEventListener(\"click\", setupGame);\n\n/* KEYBOARD */\ndocument.addEventListener(\"keydown\", event => {\n    const key = event.key.toLowerCase();\n\n    const controls = [\n        \"arrowup\", \"arrowdown\",\n        \"arrowleft\", \"arrowright\",\n        \"w\", \"a\", \"s\", \"d\"\n    ];\n\n    if (controls.includes(key)) {\n        event.preventDefault();\n    }\n\n    if (key === \"arrowup\" || key === \"w\") {\n        changeDirection(0, -1);\n    }\n    if (key === \"arrowdown\" || key === \"s\") {\n        changeDirection(0, 1);\n    }\n    if (key === \"arrowleft\" || key === \"a\") {\n        changeDirection(-1, 0);\n    }\n    if (key === \"arrowright\" || key === \"d\") {\n        changeDirection(1, 0);\n    }\n});\n\n/* TOUCH SWIPE */\nlet touchStartX = 0;\nlet touchStartY = 0;\n\ngrid.addEventListener(\"touchstart\", event => {\n    const touch = event.touches[0];\n    touchStartX = touch.clientX;\n    touchStartY = touch.clientY;\n}, { passive: true });\n\ngrid.addEventListener(\"touchend\", event => {\n    const touch = event.changedTouches[0];\n    const dx = touch.clientX - touchStartX;\n    const dy = touch.clientY - touchStartY;\n\n    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {\n        return;\n    }\n\n    if (Math.abs(dx) > Math.abs(dy)) {\n        changeDirection(dx > 0 ? 1 : -1, 0);\n    } else {\n        changeDirection(0, dy > 0 ? 1 : -1);\n    }\n}, { passive: true });\n\n/* RESIZE */\nlet resizeTimeout;\n\nwindow.addEventListener(\"resize\", () => {\n    clearTimeout(resizeTimeout);\n    resizeTimeout = setTimeout(calculateGrid, 100);\n});\n\nwindow.addEventListener(\"orientationchange\", () => {\n    setTimeout(calculateGrid, 150);\n});\n\n/* INITIALIZE */\ncalculateGrid();\n<\/script>\n<script>\ndocument.addEventListener('click',function(e){\n  const a=e.target.closest('a[href]');\n  if(a){\n    const href=a.getAttribute('href').split(/[?#]/)[0];\n    if(/^(?:index|contact|project-(?:0[1-9]|10))\\.html$/.test(href)){\n      e.preventDefault();\n      e.stopImmediatePropagation();\n      parent.postMessage({type:'s-studio-nav',page:href},'*');\n      return;\n    }\n  }\n  const tile=e.target.closest('.project');\n  const tileLink=tile && tile.querySelector('.project-number[href]');\n  if(tileLink){\n    e.preventDefault();\n    e.stopImmediatePropagation();\n    parent.postMessage({type:'s-studio-nav',page:tileLink.getAttribute('href')},'*');\n  }\n},true);\n<\/script><\/bo alculateDiagramLayout(){\n  const maxPerRow=Math.max(1,Math.floor((columns-1)/3));\n  const diagramsPerRow=Math.min(diagrams.length,maxPerRow);\n  diagrams.forEach((diagram,index)=>{\n    const rowIndex=Math.floor(index/diagramsPerRow);\n    const columnIndex=index%diagramsPerRow;\n    const gridColumn=1+columnIndex*3;\n    const gridRow=1+rowIndex*3;\n    diagram.style.left=(gridColumn*cellWidth)+\"px\";\n    diagram.style.top=(gridRow*cellHeight)+\"px\";\n  });\n  const diagramRowCount=Math.ceil(diagrams.length/diagramsPerRow);\n  return 1+(diagramRowCount-1)*3+2+1;\n}\n\nfunction calculateVisualLayout(startRow){\n  const VISUAL_WIDTH=5,VISUAL_HEIGHT=2,VERTICAL_GAP=1,SIDE_MARGIN=1;\n  const usableColumns=columns-2*SIDE_MARGIN;\n  const visualsPerRow=usableColumns>=VISUAL_WIDTH*visuals.length?visuals.length:1;\n  const visualRowCount=Math.ceil(visuals.length/visualsPerRow);\n\n  visuals.forEach((visual,index)=>{\n    const rowIndex=Math.floor(index/visualsPerRow);\n    const columnIndex=index%visualsPerRow;\n    const gridColumn=visualsPerRow===2\n      ?(columnIndex===0?SIDE_MARGIN:columns-SIDE_MARGIN-VISUAL_WIDTH)\n      :SIDE_MARGIN;\n    const gridRow=startRow+rowIndex*(VISUAL_HEIGHT+VERTICAL_GAP);\n    visual.style.left=(gridColumn*cellWidth)+\"px\";\n    visual.style.top=(gridRow*cellHeight)+\"px\";\n  });\n\n  return startRow+visualRowCount*VISUAL_HEIGHT+\n    (visualRowCount-1)*VERTICAL_GAP+1;\n}\n\n/* SCROLL */\nconst grid=document.getElementById(\"grid\");\nconst scrollButton=document.getElementById(\"scroll-button\");\nconst scrollUpButton=document.getElementById(\"scroll-up-button\");\nconst secondSection=document.getElementById(\"project-01-second-screen\");\n\nfunction getMaxScroll(){return Math.max(0,grid.scrollHeight-grid.clientHeight)}\nfunction isAtTop(){return grid.scrollTop<=2}\nfunction isAtBottom(){return getMaxScroll()-grid.scrollTop<=2}\n\nfunction getSectionStops(){\n  const maxScroll=getMaxScroll();\n  const stops=[0,secondSection.offsetTop];\n  for(let position=secondSection.offsetTop+grid.clientHeight;\n      position<secondSection.offsetTop+secondSection.offsetHeight;\n      position+=grid.clientHeight){\n    stops.push(position);\n  }\n  stops.push(maxScroll);\n  return [...new Set(stops.map(v=>Math.max(0,Math.min(maxScroll,v))))]\n    .sort((a,b)=>a-b);\n}\n\nfunction updateScrollButtons(){\n  const showTopArrow=!isAtTop()&&getMaxScroll()>2;\n  const atBottom=isAtBottom();\n  scrollUpButton.classList.toggle(\"is-visible\",showTopArrow);\n  scrollUpButton.setAttribute(\"aria-hidden\",String(!showTopArrow));\n  scrollUpButton.tabIndex=showTopArrow?0:-1;\n  scrollButton.classList.toggle(\"is-at-bottom\",atBottom);\n  scrollButton.setAttribute(\"aria-label\",\n    atBottom?\"Sayfanın başlangıcına dön\":\"Bir ekran aşağı kaydır\");\n}\n\nscrollButton.addEventListener(\"click\",()=>{\n  if(isAtBottom()){\n    grid.scrollTo({top:0,behavior:\"smooth\"});\n    return;\n  }\n  const next=getSectionStops().find(stop=>stop>grid.scrollTop+2);\n  grid.scrollTo({top:next===undefined?getMaxScroll():next,behavior:\"smooth\"});\n});\nscrollUpButton.addEventListener(\"click\",()=>{\n  const previous=getSectionStops().filter(stop=>stop<grid.scrollTop-2).pop();\n  grid.scrollTo({top:previous===undefined?0:previous,behavior:\"smooth\"});\n});\ngrid.addEventListener(\"scroll\",updateScrollButtons,{passive:true});\n\n/* RESPONSIVE GRID */\nfunction calculateGrid(){\n  const width=window.innerWidth;\n  const viewportHeight=window.innerHeight;\n  const landscape=width>=viewportHeight;\n  const minDivisor=landscape?4:2.5;\n  const maxDivisor=landscape?8:4;\n  const preferredDivisor=landscape?8:2.8;\n  let bestScore=Infinity,best=null;\n\n  for(let divisor=minDivisor;divisor<=maxDivisor+0.001;divisor+=0.1){\n    let availableHeight=viewportHeight;\n    let testColumns=1,testRows=1,testCellWidth=1,testCellHeight=1,headerHeight=0;\n    for(let iteration=0;iteration<4;iteration++){\n      const baseSize=Math.min(width,availab eight =\n        (viewportHeight - best.headerHeight) / rows;\n\n    const gridViewportHeight =\n        viewportHeight - best.headerHeight;\n\n    document.documentElement.style.setProperty(\n        \"--header-height\",\n        best.headerHeight + \"px\"\n    );\n\n    document.documentElement.style.setProperty(\n        \"--cell-width\",\n        cellWidth + \"px\"\n    );\n\n    document.documentElement.style.setProperty(\n        \"--cell-height\",\n        cellHeight + \"px\"\n    );\n\n    document.documentElement.style.setProperty(\n        \"--grid-viewport-height\",\n        gridViewportHeight + \"px\"\n    );\n}\n\n/* RESIZE */\nlet resizeTimeout;\n\nwindow.addEventListener(\"resize\", () => {\n    clearTimeout(resizeTimeout);\n    resizeTimeout = setTimeout(calculateGrid, 100);\n});\n\nwindow.addEventListener(\"orientationchange\", () => {\n    setTimeout(calculateGrid, 150);\n});\n\n/* INITIALIZE */\nsetupProjectNavigation();\ncalculateGrid();\n<\/script>\n\n<script>\ndocument.addEventListener('click',function(e){\n  const a=e.target.closest('a[href]');\n  if(a){\n    const href=a.getAttribute('href').split(/[?#]/)[0];\n    if(/^(?:index|contact|project-(?:0[1-9]|10))\\.html$/.test(href)){\n      e.preventDefault();\n      e.stopImmediatePropagation();\n      parent.postMessage({type:'s-studio-nav',page:href},'*');\n      return;\n    }\n  }\n  const tile=e.target.closest('.project');\n  const tileLink=tile && tile.querySelector('.project-number[href]');\n  if(tileLink){\n    e.preventDefault();\n    e.stopImmediatePropagation();\n    parent.postMessage({type:'s-studio-nav',page:tileLink.getAttribute('href')},'*');\n  }\n},true);\n<\/script><\/body>\n<\/html>\n"};
